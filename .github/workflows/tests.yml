name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  numerical-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Validate recorded benchmark
        run: python scripts/validate_experiments.py
      - name: Validate recorded Gazebo run
        run: python scripts/validate_localization_run.py results/localization/gazebo_outage
      - name: Check shell syntax
        run: bash -n gazebo/run_localization.sh scripts/publish_github.sh
